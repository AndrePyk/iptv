
name: Update IPTV playlist

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge playlists
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path

          sources = [
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_belarus.m3u8",
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_ukraine.m3u8",
              "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_russia.m3u8",
          ]

          output = ["#EXTM3U"]
          total = 0

          for url in sources:
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=60) as response:
                  data = response.read().decode("utf-8-sig")

              lines = [
                  line.rstrip()
                  for line in data.splitlines()
                  if line.strip()
                  and not line.lstrip().startswith("#EXTM3U")
              ]

              count = sum(
                  1 for line in lines
                  if line.startswith("#EXTINF")
              )

              if count == 0:
                  raise RuntimeError(f"No channels found: {url}")

              output.extend(lines)
              total += count

          Path("playlist.m3u8").write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print(f"Total channels: {total}")
          PY

      - name: Save updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          if git diff --cached --quiet; then
            echo "Playlist unchanged"
          else
            git commit -m "Update IPTV playlist"
            git push
          fi

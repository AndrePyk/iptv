name: Update IPTV playlist

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check script syntax
        run: python -m py_compile .github/scripts/build_playlist.py

      - name: Build playlist
        run: python .github/scripts/build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          if git diff --cached --quiet; then
            echo "Playlist unchanged"
          else
            git commit -m "Update filtered IPTV playlist"
            git push
          fi
